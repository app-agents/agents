name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci

      # Generated files are committed so editors work without a build, which
      # means CI has to prove they are not stale.
      - name: Regenerate types and registry
        run: |
          npm run gen:types
          npm run registry
      - name: Generated files are current
        run: |
          git diff --exit-code -- 'apps/*/src/types.d.ts' registry.json

      - run: npm run typecheck
      - run: npm run check:wiring
      - run: npm run build
