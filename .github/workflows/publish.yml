name: publish

# One tag, one package: `gmail@0.1.1` publishes @app-agents/gmail.
# Uses npm trusted publishing (OIDC), so there is no token to store or rotate.
#
# One-time setup per package, on npmjs.com (needs 2FA):
#   npmjs.com → Packages → <package> → Settings → Trusted publishing → GitHub Actions
#     Organization or user: app-agents
#     Repository:            agents
#     Workflow filename:     publish.yml
#     Allowed actions:       ALSO tick "Allow npm publish"
#                            (new configs default to stage-only)
#   Repeat for @app-agents/core, gmail, snapchat-ads, cli.
#
# A new trusted publisher expires after 2 days unless the first publish
# succeeds, so configure all four and release once, promptly.

on:
  push:
    tags:
      - "*@*"
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace package to publish, e.g. @app-agents/gmail"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # required for OIDC -> trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds

      # Trusted publishing needs a recent npm.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Resolve package
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.package }}" >> "$GITHUB_OUTPUT"
          else
            app="${GITHUB_REF_NAME%@*}"
            echo "name=@app-agents/${app}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --workspace "${{ steps.pkg.outputs.name }}" --access public

      - name: Report
        run: |
          echo "published ${{ steps.pkg.outputs.name }}"
          npm view "${{ steps.pkg.outputs.name }}" version dist.integrity
